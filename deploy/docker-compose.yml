services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    image: traceai-api:latest
    restart: unless-stopped
    ports:
      - "3847:3847"
    env_file:
      - .env
    environment:
      PORT: "3847"
      TRACEAI_AUTH_DB: /data/traceai-auth.sqlite
    volumes:
      - traceai-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3847/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_CMS_API_URL: ${NEXT_PUBLIC_CMS_API_URL:-https://aurora-api.joostvanleeuwaarden.com}
        NEXT_PUBLIC_CMS_SITE_KEY: ${NEXT_PUBLIC_CMS_SITE_KEY}
        NEXT_PUBLIC_TRACEAI_EVENTS_URL: ${NEXT_PUBLIC_TRACEAI_EVENTS_URL:-http://192.168.1.91:3847/events}
    image: traceai-web:latest
    restart: unless-stopped
    ports:
      # Aurora already owns 3010 on this Pi.
      - "3011:3000"
    env_file:
      - .env
    environment:
      # Server-only write proxy for the New ticket form (not NEXT_PUBLIC).
      TRACEAI_API_URL: ${TRACEAI_API_URL:-http://api:3847}
      TRACEAI_TOKEN: ${TRACEAI_TOKEN:-}
      # Session cookie HMAC (UI credentials come from Aurora app_login).
      TRACEAI_SESSION_SECRET: ${TRACEAI_SESSION_SECRET:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  traceai-data:
